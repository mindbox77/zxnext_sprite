################################################################################
# Build the zxnext_sprite library and demo with the latest z88dk nightly build,
# installed from the z88dk snap package (edge channel). On a version tag (v*),
# the distribution archives are attached to a GitHub release.
################################################################################

name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install z88dk nightly
        run: |
          sudo snap install z88dk --edge
          sudo snap alias z88dk.zcc zcc
          snap list z88dk

      - name: Build library and demo
        run: |
          make all
          make -C demo all

      - name: Create distribution archives
        run: make distro

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zxnext_sprite
          path: |
            build/zxnext_sprite.zip
            build/zxnext_sprite_z88dk.zip
            demo/bin/*/zxnext_sprite_demo.nex

      - name: Attach archives to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/zxnext_sprite.zip build/zxnext_sprite_z88dk.zip \
            --title "$GITHUB_REF_NAME" --generate-notes
